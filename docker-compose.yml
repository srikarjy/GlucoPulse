services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: glucopulse-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: glucopulse-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic cgm-raw --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic cgm-dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic cgm-parse-errors --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic cgm-implausible --partitions 1 --replication-factor 1

  timescaledb:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: glucopulse-timescaledb
    ports:
      - "5544:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      GLUCOPULSE_FHIR_DB_PASSWORD: ${GLUCOPULSE_FHIR_DB_PASSWORD:-}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./timescaledb/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  grafana:
    image: grafana/grafana:11.2.0
    container_name: glucopulse-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  producer:
    build: ./producer
    container_name: glucopulse-producer
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - "./data/azt1d/extracted/AZT1D 2025/CGM Records:/data:ro"

  consumer:
    build: ./consumer
    container_name: glucopulse-consumer
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: glucopulse-airflow
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      PG_HOST: timescaledb
      PG_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark:/opt/airflow/spark
      - airflow_data:/opt/airflow
    depends_on:
      timescaledb:
        condition: service_healthy

  model:
    build: ./model
    container_name: glucopulse-model
    profiles: ["tools"]
    environment:
      PG_HOST: timescaledb
      PG_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./model:/app
    depends_on:
      timescaledb:
        condition: service_healthy

  serving:
    build:
      context: .
      dockerfile: serving/Dockerfile
    container_name: glucopulse-serving
    ports:
      - "8000:8000"
    profiles: ["tools"]
    environment:
      # FHIR facade. Empty values fail closed: no auth config -> every
      # protected endpoint returns 401; no pseudonym key -> store won't start.
      PG_HOST: timescaledb
      PG_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      GLUCOPULSE_FHIR_DB_USER: glucopulse_fhir
      GLUCOPULSE_FHIR_DB_PASSWORD: ${GLUCOPULSE_FHIR_DB_PASSWORD:-}
      GLUCOPULSE_AUTH_MODE: ${GLUCOPULSE_AUTH_MODE:-}
      GLUCOPULSE_JWT_SECRET: ${GLUCOPULSE_JWT_SECRET:-}
      GLUCOPULSE_JWKS_URL: ${GLUCOPULSE_JWKS_URL:-}
      GLUCOPULSE_ISSUER: ${GLUCOPULSE_ISSUER:-}
      GLUCOPULSE_AUDIENCE: ${GLUCOPULSE_AUDIENCE:-glucopulse-fhir}
      GLUCOPULSE_PSEUDONYM_KEY: ${GLUCOPULSE_PSEUDONYM_KEY:-}
      GLUCOPULSE_PUBLIC_URL: ${GLUCOPULSE_PUBLIC_URL:-https://localhost:8443}
      GLUCOPULSE_AUDIT_PATH: /audit/audit.jsonl
    volumes:
      - audit_data:/audit
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # TLS termination for the FHIR facade (HIPAA 164.312(e)(1) transmission
  # security). Local CA via Caddy's `tls internal`; swap in a real cert for
  # anything beyond localhost.
  serving-tls:
    image: caddy:2.8.4
    container_name: glucopulse-serving-tls
    profiles: ["tools"]
    ports:
      - "8443:8443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - serving

  # Local FHIR server standing in for an EHR. Synthetic data only.
  hapi-fhir:
    image: hapiproject/hapi:v7.4.0
    container_name: glucopulse-hapi-fhir
    profiles: ["fhir"]
    ports:
      - "8090:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.validation.requests_enabled: "true"
      hapi.fhir.allow_external_references: "true"

volumes:
  audit_data:
  caddy_data:
  kafka_data:
  timescaledb_data:
  grafana_data:
  airflow_data:
