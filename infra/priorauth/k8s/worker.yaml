apiVersion: apps/v1
kind: Deployment
metadata: { name: pa-worker, labels: { app: pa-worker } }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: pa-worker } }
  template:
    metadata:
      labels: { app: pa-worker }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9102", prometheus.io/path: /metrics }
    spec:
      serviceAccountName: pa-worker
      terminationGracePeriodSeconds: 120      # worker drains in-flight pipelines on SIGTERM
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: pa-worker } } }
      containers:
        - name: worker
          image: priorauth
          command: ["python","-m","priorauth.worker"]
          ports: [{ containerPort: 9102 }]
          envFrom: [{ configMapRef: { name: pa-config } }, { secretRef: { name: pa-secrets } }]
          env: [{ name: PORT, value: "9102" }]
          resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /metrics, port: 9102 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /metrics, port: 9102 }, periodSeconds: 20, failureThreshold: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: pa-worker }
spec:
  selector: { app: pa-worker }
  ports: [{ port: 9102, targetPort: 9102 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: pa-worker }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: pa-worker } }
