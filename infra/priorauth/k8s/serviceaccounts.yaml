# IRSA: only the worker's role may call Bedrock (see infra terraform for the ECS equivalent). Replace ACCOUNT_ID.
apiVersion: v1
kind: ServiceAccount
metadata: { name: pa-api }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pa-worker
  annotations: { eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/priorauth-worker" }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: pa-mcp }
automountServiceAccountToken: false
