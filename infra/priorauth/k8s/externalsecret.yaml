# External Secrets Operator pulls from AWS Secrets Manager; no secret material lives in git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: pa-secrets }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: pa-secrets }
  data:
    - { secretKey: PRIORAUTH_DB_PASSWORD, remoteRef: { key: priorauth/staging/db-password } }
    - { secretKey: PRIORAUTH_JWT_SECRET, remoteRef: { key: priorauth/staging/jwt-secret } }
