apiVersion: apps/v1
kind: Deployment
metadata: { name: pa-mcp, labels: { app: pa-mcp } }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: pa-mcp } }
  template:
    metadata:
      labels: { app: pa-mcp }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8765", prometheus.io/path: /metrics }
    spec:
      serviceAccountName: pa-mcp
      terminationGracePeriodSeconds: 120      # worker drains in-flight pipelines on SIGTERM
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: pa-mcp } } }
      containers:
        - name: mcp
          image: priorauth
          command: ["python","-m","priorauth.mcp_server.server"]
          ports: [{ containerPort: 8765 }]
          envFrom: [{ configMapRef: { name: pa-config } }, { secretRef: { name: pa-secrets } }]
          env: [{ name: PORT, value: "8765" }]
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { tcpSocket: { port: 8765 }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: 8765 }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: pa-mcp }
spec:
  selector: { app: pa-mcp }
  ports: [{ port: 8765, targetPort: 8765 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: pa-mcp }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: pa-mcp } }
