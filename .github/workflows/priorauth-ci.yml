name: priorauth-ci
on:
  push: { branches: [main], paths: ["priorauth/**", "priorauth-ui/**", "tests/priorauth/**", "deploy/priorauth/**", "infra/priorauth/**", ".github/workflows/priorauth-ci.yml"] }
  pull_request: { paths: ["priorauth/**", "priorauth-ui/**", "tests/priorauth/**", "deploy/priorauth/**", "infra/priorauth/**", ".github/workflows/priorauth-ci.yml"] }
permissions: { contents: read }
concurrency: { group: "priorauth-${{ github.ref }}", cancel-in-progress: true }
env:
  PRIORAUTH_JWT_SECRET: ci-only-secret-not-used-anywhere-0123456789abcdef
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: pa, POSTGRES_DB: priorauth_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: priorauth/requirements*.txt }
      - run: pip install -r priorauth/requirements.txt -r priorauth/requirements-dev.txt
      - name: Lint
        run: ruff check --config priorauth/ruff.toml priorauth tests/priorauth
      - name: Unit + integration tests (SQLite and real Postgres/pgvector)
        env: { PRIORAUTH_TEST_PG_URL: "postgresql+psycopg://postgres:pa@localhost:5432/priorauth_test" }
        run: pytest tests/priorauth -q
      - name: Regenerate scenarios - must match the committed file (labels are deterministic)
        run: |
          python -m priorauth.synth.scenarios
          git diff --exit-code priorauth/eval/scenarios_200.jsonl
      - name: 200-scenario evaluation gate (hard safety gates + accuracy floor)
        run: python -m priorauth.eval.run_eval --out eval-results.json --min-accuracy 0.95
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-results, path: eval-results.json }

  ui:
    runs-on: ubuntu-latest
    needs: test
    defaults: { run: { working-directory: priorauth-ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # the Playwright config launches the demo API from ../.venv-pa
      - run: python -m venv ../.venv-pa && ../.venv-pa/bin/pip install -r ../priorauth/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: priorauth-ui/package-lock.json }
      - run: npm ci
      - run: npm run typecheck && npm run lint
      - run: npm run build
        env: { PRIORAUTH_API_URL: "http://127.0.0.1:8080" }
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: priorauth-ui/test-results }

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: deploy/priorauth/Dockerfile, load: true, tags: "priorauth:ci", cache-from: "type=gha", cache-to: "type=gha,mode=max" }
      - name: Container smoke - image starts and serves /healthz as non-root
        run: |
          docker run -d --name pa -p 8080:8080 -e PRIORAUTH_JWT_SECRET="$PRIORAUTH_JWT_SECRET" -e PRIORAUTH_DATABASE_URL=sqlite:////tmp/pa.db priorauth:ci
          for _ in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/healthz
          test "$(docker exec pa id -u)" = "10001"
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "priorauth:ci", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/priorauth/terraform fmt -check -recursive
      - run: terraform -chdir=infra/priorauth/terraform init -backend=false && terraform -chdir=infra/priorauth/terraform validate
      - name: Validate Kubernetes manifests
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas infra/priorauth/k8s

  deploy:
    # Not exercised by this repo's tests: needs an AWS account with the OIDC role from infra/priorauth/terraform.
    if: github.ref == 'refs/heads/main' && vars.PRIORAUTH_AWS_ROLE_ARN != ''
    needs: [test, image, iac]
    runs-on: ubuntu-latest
    environment: priorauth-staging          # configure required reviewers on this environment
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.PRIORAUTH_AWS_ROLE_ARN }}", aws-region: "${{ vars.PRIORAUTH_AWS_REGION }}" }
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push (tagged by commit SHA, never :latest)
        run: |
          IMG=${{ steps.ecr.outputs.registry }}/priorauth:${{ github.sha }}
          docker build -f deploy/priorauth/Dockerfile -t "$IMG" . && docker push "$IMG"
          echo "IMG=$IMG" >> "$GITHUB_ENV"
      - name: Register new task-definition revisions with this image and roll the services
        run: |
          for svc in api worker mcp; do
            TD=$(aws ecs describe-task-definition --task-definition priorauth-$svc --query taskDefinition)
            NEW=$(echo "$TD" | jq --arg img "$IMG" 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) | .containerDefinitions[0].image=$img')
            ARN=$(aws ecs register-task-definition --cli-input-json "$NEW" --query taskDefinition.taskDefinitionArn --output text)
            aws ecs update-service --cluster priorauth --service priorauth-$svc --task-definition "$ARN" >/dev/null
          done
          # services use the deployment circuit breaker (rollback=true): a failing rollout reverts automatically
          aws ecs wait services-stable --cluster priorauth --services priorauth-api priorauth-worker priorauth-mcp
