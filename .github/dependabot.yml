version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }

  - package-ecosystem: docker
    directories: ["/deploy/priorauth", "/serving", "/producer", "/consumer", "/model", "/airflow", "/hf_space_agent"]
    schedule: { interval: weekly }

  - package-ecosystem: pip
    directories: ["/serving", "/priorauth", "/agents", "/producer", "/consumer", "/model", "/airflow", "/hf_space_agent", "/"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: ["minor", "patch"] }

  - package-ecosystem: npm
    directory: /priorauth-ui
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: ["minor", "patch"] }
